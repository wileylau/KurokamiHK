<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kurokami — cat watch</title>
<meta name="description" content="kurokami local live-monitor: results for one watch.">
<link rel="stylesheet" href="/static/styles.css">
<script src="/static/app.js" defer></script>
</head>
<body data-page="results">

<div class="window">
  <header class="bar">
    <a class="brand" href="index.html">kurokami<span class="prompt">:~$</span></a>
    <span class="host">127.0.0.1:8080</span>
    <nav aria-label="surfaces">
      <a href="index.html" data-nav="index">roster</a>
      <a href="feed.html" data-nav="feed">feed</a>
      <a href="settings.html" data-nav="settings">settings</a>
    </nav>
    <span class="clock" id="clock" aria-live="off">--:--:--</span>
  </header>

  <main>
    <header class="page-head">
      <h1>cat watch::&hellip;</h1>
      <a class="btn" href="index.html">[back to roster]</a>
      <button class="btn btn-primary btn-add" id="rescan" type="button">[rescan]</button>
    </header>

    <div class="meta">
      <span id="meta-query"><b>query</b>&nbsp; &hellip;</span>
      <span id="meta-interval"><b>interval</b>&nbsp; &hellip;</span>
      <span id="meta-last"><b>last scan</b>&nbsp; &hellip;</span>
      <span id="meta-next"><b>next scan</b>&nbsp; &hellip;</span>
    </div>

    <div class="listing-head">
      <span class="section-label" id="scan-label">&hellip;</span>
      <div class="sort-bar" id="sort-bar">
        <span class="sort-label">sort&nbsp;</span>
        <button class="btn sort-btn is-active" type="button" data-sort="new">new</button>
        <button class="btn sort-btn" type="button" data-sort="price_asc">low &rarr; high</button>
        <button class="btn sort-btn" type="button" data-sort="price_desc">high &rarr; low</button>
      </div>
    </div>

    <div class="listing" id="listing"></div>
  </main>

  <footer class="statusline">
    <span id="sline-main">-- &hellip; --</span>
    <span id="sline-aux" class="faint">-- &hellip; --</span>
  </footer>
</div>

</body>
</html>
