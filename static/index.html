<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kurokami — watchers</title>
<meta name="description" content="kurokami local live-monitor: watch roster.">
<link rel="stylesheet" href="/static/styles.css">
<script src="/static/app.js" defer></script>
</head>
<body data-page="index">

<div class="window">
  <header class="bar">
    <a class="brand" href="index.html">kurokami<span class="prompt">:~$</span></a>
    <span class="host">127.0.0.1:8080</span>
    <nav aria-label="surfaces">
      <a href="index.html" data-nav="index">roster</a>
      <a href="feed.html" data-nav="feed">feed</a>
      <a href="settings.html" data-nav="settings">settings</a>
    </nav>
    <span class="clock" id="clock" aria-live="off">--:--:--</span>
  </header>

  <main>
    <header class="page-head">
      <h1>watchers</h1>
      <span class="rollup" id="rollup">loading &hellip;</span>
      <a class="btn btn-primary btn-add" href="settings.html">[+] add watch</a>
    </header>

    <section id="politeness" role="note" aria-label="politeness warnings"></section>

    <div class="section-label">roster: most recently scanned first, stalled pinned</div>

    <div class="roster" id="roster">
      <div class="roster-head">
        <span>watch</span><span>query</span><span>int</span><span>last scan</span><span>next scan</span><span>count</span><span>state</span><span>act</span>
      </div>
    </div>
  </main>

  <footer class="statusline">
    <span id="sline-main">-- politeness queue: &hellip; --</span>
    <span id="sline-aux" class="faint">-- &hellip; --</span>
  </footer>
</div>

</body>
</html>
